<!--
  Supabase Auth email template: Magic Link
  Where to paste: Supabase Dashboard -> Authentication -> Email Templates -> Magic Link
  Subject: Votre lien de connexion – Asso d'ici

  This file is not read by the app at runtime — Supabase's email templates
  live in the project's remote Auth config (Dashboard or the Management
  API), not in this repo. Kept here so the source is versioned and easy
  to find/copy instead of living only in a chat transcript.

  Note: the logo <img> below points at https://assodici.fr/brand/logo-on-dark.png
  — only resolves once this branch is deployed to production.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafaf9;padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background-color:#c73e1d;padding:28px 32px;text-align:center;">
            <img src="https://assodici.fr/brand/logo-on-dark.png" width="160" alt="Asso d'ici" style="display:inline-block;height:auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:40px 32px;text-align:center;">
            <h1 style="margin:0 0 20px;font-family:Arial,Helvetica,sans-serif;font-size:26px;line-height:1.3;color:#111810;">
              Votre lien de connexion
            </h1>
            <p style="margin:0 0 32px;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.6;color:#111810;">
              Cliquez sur le bouton ci-dessous pour vous connecter.<br>Ce lien ne fonctionne qu'une seule fois.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
              <tr>
                <td style="border-radius:12px;background-color:#4381c1;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:18px 48px;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:12px;">
                    Se connecter
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:32px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#555555;">
              Vous n'avez rien demandé&nbsp;? Ignorez cet email, il ne se passera rien.
            </p>
          </td>
        </tr>
        <tr>
          <td style="background-color:#f2ed6f;padding:20px 32px;text-align:center;">
            <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#111810;">
              Asso d'ici — assodici.fr
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
